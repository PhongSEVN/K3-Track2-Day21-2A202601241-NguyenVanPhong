name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    env:
      DAGSHUB_MLFLOW_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}
      deploy_ok: ${{ steps.read_metrics.outputs.deploy_ok }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        run: |
          echo '${{ secrets.CLOUD_CREDENTIALS }}' > /tmp/sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV

      - name: Pull data with DVC
        run: dvc pull data/train_phase1.csv.dvc data/eval.csv.dvc

      # Bonus 1: neu secrets DagsHub duoc cau hinh, ghi thi nghiem len tracking
      # server tu xa thay vi sqlite cuc bo tren runner.
      - name: Configure remote MLflow tracking (optional, Bonus 1)
        if: ${{ env.DAGSHUB_MLFLOW_URI != '' }}
        run: |
          echo "MLFLOW_TRACKING_URI=${{ secrets.MLFLOW_TRACKING_URI }}" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_USERNAME=${{ secrets.MLFLOW_TRACKING_USERNAME }}" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_PASSWORD=${{ secrets.MLFLOW_TRACKING_PASSWORD }}" >> $GITHUB_ENV

      - name: Train model
        env:
          GCS_BUCKET: ${{ secrets.CLOUD_BUCKET }}
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        run: |
          python - <<'EOF'
          import json, os
          d = json.load(open("outputs/metrics.json"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"accuracy={d['accuracy']}\n")
              f.write(f"deploy_ok={'true' if d['deploy_ok'] else 'false'}\n")
          EOF

      # Bonus 4: chi ghi de model/metrics tren GCS neu model moi khong te hon
      # model dang chay (should_deploy() trong src/train.py da tinh san deploy_ok).
      - name: Upload model to Cloud Storage
        if: steps.read_metrics.outputs.deploy_ok == 'true'
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}
        run: |
          python - <<'EOF'
          from google.cloud import storage
          import os

          bucket_name = os.environ["CLOUD_BUCKET"]
          client = storage.Client()
          bucket = client.bucket(bucket_name)
          bucket.blob("models/latest/model.pkl").upload_from_filename("models/model.pkl")
          bucket.blob("models/latest/metrics.json").upload_from_filename("outputs/metrics.json")
          print(f"Model + metrics da duoc upload len gs://{bucket_name}/models/latest/")
          EOF

      - name: Save metrics and report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: |
            outputs/metrics.json
            outputs/report.txt


  # ---------------------------------------------------------------------------
  # JOB 3 - EVAL
  # Kiem tra nguong chat luong (accuracy >= 0.70).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check eval gate
        run: |
          python - <<'EOF'
          acc = float("${{ needs.train.outputs.accuracy }}")
          deploy_ok = "${{ needs.train.outputs.deploy_ok }}" == "true"

          if acc < 0.70:
              raise SystemExit(f"FAILED: accuracy {acc:.4f} < 0.70. Huy deploy.")
          if not deploy_ok:
              raise SystemExit("FAILED: model moi te hon model dang chay (rollback gate). Huy deploy.")

          print(f"PASSED: accuracy {acc:.4f} >= 0.70 va khong bi regression. Dang trien khai model.")
          EOF


  # ---------------------------------------------------------------------------
  # JOB 4 - DEPLOY
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Eval) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sudo systemctl restart mlops-serve
            for i in 1 2 3 4 5 6; do
              sleep 5
              curl -sf http://localhost:8000/health && echo "Health check passed." && exit 0
              echo "Thu lan $i that bai, cho them..."
            done
            echo "Health check that bai sau nhieu lan thu." && exit 1
