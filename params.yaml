# Sieu tham so huan luyen. Doi model_type + sieu tham so tuong ung giua cac lan chay
# de thi nghiem (Buoc 1, Bonus 2).

# model_type: random_forest | gradient_boosting | logistic_regression
# Chon random_forest (300/None/2) vi cho accuracy cao nhat sau khi thu 17 run o Buoc 1.
model_type: random_forest

random_forest:
  n_estimators: 300
  max_depth: null
  min_samples_split: 2

gradient_boosting:
  n_estimators: 200
  max_depth: 3
  learning_rate: 0.1

logistic_regression:
  C: 1.0
  max_iter: 2000
